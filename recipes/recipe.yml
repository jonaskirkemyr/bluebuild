---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: bluebuild
# description will be included in the image's metadata
description: My personal KDE Plasma desktop, built on Fedora Kinoite.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/kinoite-main
# pinned to a Fedora major so a new release never arrives unannounced.
# still tracks daily security updates within F44. bump deliberately when F45 is out.
image-version: 44

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  # locale, keymap and timezone, so systemd-firstboot has nothing left to ask on
  # the first boot of a fresh install
  - type: script
    scripts:
      - system-defaults.sh

  # only things that must be system-wide: the login shell, and GUI binaries that
  # need the system GL drivers or host toolchains. everything else is Home
  # Manager's job — see docs/SETUP.md
  - type: dnf
    repos:
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
      files:
        - vscode.repo # files/dnf/vscode.repo
    install:
      packages:
        - micro
        - zsh # login shell must be a system path. ublue removes /usr/bin/chsh — use `ujust set-default-shell`
        - kitty # from the RPM so it gets the system GL drivers (this is what nixGL worked around)
        - code # VS Code. RPM, not flatpak: the sandbox can't see the nix store or direnv
        # Nix, from Fedora rather than the Determinate installer. This is layer 2's
        # foundation (Home Manager, per-project dev shells) so a fresh machine has
        # to have it before it can do anything, and downloading an installer over
        # the network on first boot is the fragile way to get there. The RPMs are
        # also already set up for an atomic host: nix is /usr/bin/nix so it is on
        # PATH everywhere, nix-daemon.service expects /nix to be a separate mount,
        # /etc/nix/nix.conf enables flakes and points ssl-cert-file at the system CA
        # bundle (so a TLS-inspecting corporate proxy works), and nix-system creates
        # the nixbld build users. See docs/SETUP.md.
        - nix
        - nix-daemon # multi-user mode; the store is shared, builds run as nixbld-*

  # /nix comes from the RPM but the image root is read-only, so the store needs a
  # writable filesystem over it. nix-store.sh has the SELinux half of that, the two
  # units under files/system/ have the rest.
  - type: script
    scripts:
      - nix-store.sh

  - type: systemd
    system:
      enabled:
        # bind-mounts /var/lib/nix onto /nix. pulls in nix-store-dir.service itself,
        # which is why that one is not listed here
        - nix.mount
        - nix-daemon.socket
        - nix-daemon.service # shipped disabled; README.fedora.md says to enable it

  # nerd font installed system-wide so fontconfig serves it to non-Nix apps too
  - type: fonts
    fonts:
      nerd-fonts:
        - Inconsolata # no spaces, no "Nerd Font" suffix

  # bakes `ujust setup-nix` / `setup-home-manager` etc. into the image, so a
  # fresh install can pull down the Home Manager config in two commands
  - type: justfiles
    validate: true

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.mozilla.firefox
          - com.jetbrains.IntelliJ-IDEA-Community
      - scope: user # Also add Flathub user repo, but no user packages

  # no dotfiles module here: Home Manager owns layer 2 (see the nix-config repo)

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
