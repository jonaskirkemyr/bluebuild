# nix-system ships /nix/store in the image, but nix.mount covers /nix with writable
# storage from /var/lib/nix, which hides it. Recreate it inside the mount, with the
# mode and ownership the RPM uses (drwxrwxr-t root:nixbld — group-writable so the
# nixbld build users can add store paths, sticky so they cannot remove each other's).
#
# Fedora ships nix-filesystem.conf and nix-daemon.conf, which between them cover
# /nix, /nix/var, /nix/var/log/nix and /nix/var/nix/daemon-socket. /nix/store is the
# one directory neither of them creates, because on an ordinary Fedora install the
# RPM's own copy is simply there.
#
# The timing works out without any extra ordering: systemd-tmpfiles-setup.service
# runs After=local-fs.target, so after nix.mount, and After=systemd-sysusers.service,
# so `nixbld` resolves.
d /nix/store 1775 root nixbld -
