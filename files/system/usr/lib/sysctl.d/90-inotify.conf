# inotify limits, raised for a desktop.
#
# Nothing in Fedora or the Universal Blue base sets these, so what you get is the
# kernel's own default (fs/notify/inotify/inotify_user.c, inotify_user_setup):
#
#   max_user_instances = 128
#   max_user_watches   = 1% of addressable memory / ~1 KB per watch,
#                        clamped to [8192, 1048576]
#
# The second one is memory-derived, so it is not a fixed number you can look up —
# read it with `sysctl fs.inotify.max_user_watches`. Both limits are per *user*,
# not per process, which is why one runaway file watcher starves everything else.
#
# KDE notices before things break: the kde-inotify-survey kded module polls
# /proc/sys/fs/inotify and raises "Inotify Watch Capacity Low" / "Inotify Instance
# Capacity Low" as you approach either. Its "increase the limit" button writes to
# /proc/sys directly, so that fix lasts until the next reboot — this file is the
# same fix, declared.
#
# Cost: a watch pins ~1 KB of unswappable kernel memory, and only while something
# holds it. Raising the ceiling costs nothing by itself. 524288 is the number
# VS Code's docs ask for, and code/Electron watching a node_modules tree is the
# usual reason to need it.
#
# This is /usr/lib/sysctl.d (vendor), not /etc/sysctl.d, so a machine-local file
# in /etc still wins and /etc stays yours. Applied at boot by
# systemd-sysctl.service; `sudo sysctl --system` applies it without rebooting.
fs.inotify.max_user_watches = 524288

# Instances are whole inotify file descriptors — one or more per watching process.
# 128 is easy to reach with a desktop full of Electron apps, Flatpak portals and a
# file indexer, and it is the cheaper of the two limits to raise.
fs.inotify.max_user_instances = 1024
